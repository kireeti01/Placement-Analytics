services:
  # 1. AI ML Microservice
  - type: web
    name: campusplacement-ai
    env: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: AI_SERVICE_HOST
        value: 0.0.0.0
      - key: AI_SERVICE_PORT
        value: 8001

  # 2. Node.js Express Backend API
  - type: web
    name: campusplacement-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run sync && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: campusplacement-db
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: campusplacement-ai
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@campusplacement.ai
      - key: SUPER_ADMIN_PASSWORD
        value: super123

  # 3. React Frontend (Static Site)
  - type: web
    name: campusplacement-frontend
    env: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: campusplacement-backend
          property: host


databases:
  - name: campusplacement-db
    plan: free
    databaseName: campusplacement
    user: postgres
